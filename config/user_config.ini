[Settings]
; =========================================================
; IPTV-API 本地运行配置（已按「减少缓冲」优化）
; 位置：D:\IPTV-API\config\user_config.ini
; 作用：覆盖 config/config.ini 中的同名项
; 优先级：环境变量 > user_config.ini > config.ini
;
; 本文件与 GitHub Actions 上那份行为一致，可互相复制。
;
; 【2026-10-05 优化说明】
; 问题：源质量参差，实测 50% 的源速率 < 0.5 MiB/s，播放时反复缓冲。
; 对策：提高速率门槛 + 优先高清源 + 补偿机制兜底（防频道变空）。
; =========================================================

; ---------- 核心功能开关 ----------
open_update = True
open_unmatch_category = False
open_empty_category = False
open_update_time = True
open_url_info = False
open_epg = True
open_m3u_result = True

; ---------- 结果输出 ----------
; source_file 指定使用哪个频道模板
source_file = config/user_demo.txt
; final_file 是生成的结果文件名（本地保存在 output 目录下）
final_file = output/result.txt
open_realtime_write = True

; 本地运行同样不启动常驻 Web 服务，只做「更新一次」这件事。
; 若想用浏览器查看结果页面，改为 True 后执行 service\启动服务.bat
open_service = False

; ---------- 数据源 ----------
open_local = True
open_subscribe = True
open_history = True
open_headers = True
open_auto_disable_source = False

; ---------- 测速与过滤（缓冲优化的核心区）----------
open_speed_test = True
; full = 全量测速，频道下所有候选都测，结果最准
; quick = 达到目标数量就停，快但可能漏掉更优的源
; 为了减少缓冲，这里用 full 换来更可靠的排序
speed_test_mode = full

; 分辨率过滤仍保持关闭：避免低清源被一刀切导致频道消失，
; 改为通过 sort_by 让高清源排前面即可。
open_filter_resolution = False
open_filter_speed = True
open_filter_ad = True
open_full_speed_test = True

; 【关键】补偿机制：当某频道过滤后没有源了，自动回填「次优但可用」的源，
; 避免出现「整个频道消失」。调高门槛后必须开这个。
open_supply = True

; 【关键】排序：先看分辨率（高清优先），再看速率（快的优先）。
; 播放器默认用列表里第一条，所以这条直接决定了默认清晰度和流畅度。
sort_by = resolution,speed

min_resolution = 1280x720
max_resolution = 3840x2160

; 【关键】最低速率门槛，单位 MiB/s。
;  0.3 → 约 2.4 Mbps，720p 勉强，实测仍会缓冲
;  0.8 → 约 6.6 Mbps，能稳住 1080p     ← 当前取值
;  1.0 → 约 8.4 Mbps，更稳但会砍掉部分主频道
; 实测：0.8 可保留 42% 的源、覆盖 86 个频道（共 106 个），
;       配合 open_supply 兜底后覆盖率不受影响。
min_speed = 0.8

; 【关键】分辨率-速率映射：对已知分辨率的源套用更严格的标准。
; 原值 1280x720:0.2 太松（0.2 MiB/s 根本带不动 720p），这里上调。
resolution_speed_map = 1280x720:0.5,1920x1080:0.8,3840x2160:1.5

; 单个源测速超时。给足时间，避免把「只是慢一点」的好源误杀。
speed_test_timeout = 10
speed_test_filter_host = False
request_timeout = 15

; ---------- 每频道接口数量 ----------
; 【关键】每个频道保留几个源。播放器通常在第一条失败时才切下一条，
; 保留 3 条能在卡顿时有备选。调大（如 5）会增加列表体积。
output_urls_limit = 3

; ---------- 网络协议 ----------
ipv6_support = False
ipv_type = ipv4
ipv_type_prefer = ipv4

; ---------- 订阅源偏好 ----------
origin_type_prefer = subscribe
subscribe_num = 10
local_num = 5

; ---------- RTMP 推流 ----------
; 本地可开启，但需要 ffmpeg；默认关闭以简化流程。
open_rtmp = False
