[Settings]
; =========================================================
; IPTV-API 用户配置（修正版）
; 基于你仓库现有 user_config.ini 精简，只保留需覆盖的项
; 放在 config/user_config.ini 覆盖 config.ini
; 优先级：环境变量 > user_config.ini > config.ini
; =========================================================

; ---------- 核心功能开关 ----------
open_update = True
open_unmatch_category = False
open_empty_category = False
open_update_time = True
open_url_info = False
open_epg = True
open_m3u_result = True

; ---------- 结果输出 ----------
; 这样 Pages 地址稳定为 /result.m3u 与 /result.txt，便于播放器订阅
source_file = config/user_demo.txt
final_file = output/user_result.txt
open_realtime_write = True

; Actions 环境不启动常驻服务（工作流只跑更新，不需要 Web 服务）
open_service = False

; ---------- 数据源 ----------
open_local = True
open_subscribe = True
open_history = True
open_headers = True
open_auto_disable_source = False

; ---------- 测速与过滤（首次运行建议配置）----------
open_speed_test = True
speed_test_mode = quick

; 首跑建议先关掉分辨率过滤，避免低清源被一刀切，
; 便于判断“是源本身没有这个台”还是“被分辨率卡掉了”。
; 跑通确认频道都有结果后，再改回 True。
open_filter_resolution = False
open_filter_speed = True
open_filter_ad = True
open_full_speed_test = False
open_supply = True
sort_by = speed

min_resolution = 1280x720
max_resolution = 3840x2160
min_speed = 0.3

speed_test_timeout = 10
speed_test_filter_host = False
request_timeout = 15

; ---------- 每频道接口数量 ----------
output_urls_limit = 3

; ---------- 网络协议 ----------
ipv6_support = False
ipv_type = ipv4
ipv_type_prefer = ipv4

; ---------- 订阅源偏好 ----------
origin_type_prefer = subscribe
subscribe_num = 10
local_num = 5

; ---------- RTMP 推流 ----------
; GitHub Actions 环境会强制关闭此功能，设为 False 避免误导。
; 若日后改用 Docker 部署，再改为 True。
open_rtmp = False
